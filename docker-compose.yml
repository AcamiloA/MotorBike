services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: motorbike
      POSTGRES_USER: motorbike
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Genera POSTGRES_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motorbike -d motorbike"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PORT: 8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=motorbike;Username=motorbike;Password=${POSTGRES_PASSWORD:?Genera POSTGRES_PASSWORD en .env}
      Jwt__Key: ${JWT_KEY:?Genera JWT_KEY en .env}
      Database__ApplyMigrationsOnStartup: "true"
      Seed__Enabled: "${SEED_ENABLED:-false}"
      Seed__DemoEnabled: "${DEMO_ENABLED:-false}"
      Seed__AllowDemoInProduction: "${ALLOW_DEMO_IN_PRODUCTION:-false}"
      Seed__DemoPassword: "${DEMO_PASSWORD:-}"
      HttpsRedirection__Enabled: "false"
      Storage__Provider: Local
      Storage__LocalRootPath: /app/App_Data/private-files
      DocumentOcr__Enabled: "${DocumentOcr__Enabled:-false}"
      EmailDelivery__Enabled: "${EmailDelivery__Enabled:-false}"
      EmailDelivery__Provider: "${EmailDelivery__Provider:-Smtp}"
      Smtp__Host: "${Smtp__Host:-}"
      Smtp__Port: "${Smtp__Port:-587}"
      Smtp__UseStartTls: "${Smtp__UseStartTls:-true}"
      Smtp__Username: "${Smtp__Username:-}"
      Smtp__Password: "${Smtp__Password:-}"
      Smtp__FromEmail: "${Smtp__FromEmail:-}"
      Smtp__FromName: "${Smtp__FromName:-MotorBike Park}"
      Swagger__Enabled: "${SWAGGER_ENABLED:-false}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - private-files:/app/App_Data/private-files
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  postgres-data:
  private-files:
